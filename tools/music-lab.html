<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Music lab</title>
<style>
:root{--bg:#1b1511;--panel:#2a2119;--line:#4a3a2a;--ink:#f1e7d6;--dim:#b8a68c;--hot:#f0b44a}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
#hud,#touch,#pausebtn,#overlay,#stage{display:none!important}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}p.sub{margin:0 0 14px;color:var(--dim)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
label{color:var(--dim)}select,input[type=number]{background:#15100c;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
button{background:#3a2d20;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--hot)}button.on{background:var(--hot);color:#241a10;border-color:var(--hot)}
input[type=range]{width:180px}
#now{font:13px/1.5 ui-monospace,monospace;color:var(--hot);white-space:pre-wrap}
.parts label{display:inline-flex;gap:4px;align-items:center;margin-right:10px;color:var(--ink)}
@media (max-width:600px){input[type=range]{width:120px}}
</style></head><body>
<canvas id="stage"></canvas><div id="hud"><b id="hWave"></b><em id="hChapter"></em><em id="hSpeed"></em><b id="hScore"></b><b id="hKills"></b><i id="hpfill"></i><span id="hpTxt"></span><i id="xpfill"></i><span id="xpTxt"></span><div id="loadout"></div><div id="tips"></div></div>
<div id="touch"><div id="joy"><i></i></div><div id="kickbtn"></div><div id="slowbtn"></div><div id="roverbtn"></div></div><div id="pausebtn"></div><div id="overlay"></div>
<script>/* the lab is not the game: its animation loop stays stopped */ window.requestAnimationFrame = function(){ return 0; };</script>
<main>
<h1>Music lab</h1>
<p class="sub">Every song the band plays (js/audio/02e-02g), with the game's own engine. Pick a song, press Play, and move it the way a run would.</p>
<div class="box">
  <div class="row"><label for="song">Song</label><select id="song"></select><button id="play">Play</button><button id="stop">Stop</button></div>
  <div class="row" id="secs"><label>Go to</label></div>
  <div id="now">Press Play.</div>
</div>
<div class="box">
  <div class="row"><label><input type="checkbox" id="run"> In a run (the fight picks the sections)</label></div>
  <div class="row"><label for="I">Fight intensity</label><input type="range" id="I" min="0" max="1" step="0.01" value="0.5"><span id="Iv">0.50</span>
    <label><input type="checkbox" id="rest"> Between waves</label></div>
  <div class="row"><label for="low">Nearly dead</label><input type="range" id="low" min="0" max="1" step="0.01" value="0"><span id="lowv">0.00</span>
    <label for="lvl">Level</label><select id="lvl"><option value="0">0 calm</option><option value="1" selected>1 normal</option><option value="2">2 boss / last seconds</option><option value="3">3 boss at half health</option></select>
    <label for="shift">Key</label><input type="number" id="shift" value="0" min="-6" max="7" style="width:56px"></div>
</div>
<div class="box">
  <div class="row parts" id="parts"><label>Parts:</label></div>
  <div class="row"><label for="solo">Solo</label><select id="solo"><option value="">none</option></select></div>
</div>
<div class="box">
  <div class="row"><label for="bars">Bars</label><input type="number" id="bars" value="32" min="1" max="200" style="width:70px"><button id="wav">Download WAV</button><span id="wavmsg" style="color:var(--dim)"></span></div>
</div>
</main>

<script>
/* Music lab: plays any song with the live engine (Music.force holds the song and the run's state), jumps between sections, mutes or
   solos parts, and draws a song into a WAV file with Band.render. No game runs on this page. */
(function(){
  var $ = function(id){ return document.getElementById(id); }, timer = null;
  var groups = [['Chapters', MUSIC_BY_CHAPTER.slice(1).concat(['marswar', 'islelab'])], ['Bosses', Object.keys(BAND_SONGS).filter(function(k){ return /^boss/.test(k); })],
    ['Town', ['town', 'townnight', 'burrow']], ['Screens', ['menu', 'shop', 'lab', 'victory', 'defeat', 'minigame']], ['Films', Object.keys(BAND_SONGS).filter(function(k){ return /^film/.test(k); })]];
  groups.forEach(function(g){ var og = document.createElement('optgroup'); og.label = g[0]; g[1].forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = k + ' - ' + (BAND_SONGS[k] && BAND_SONGS[k].name || ''); og.appendChild(o); }); $('song').appendChild(og); });
  ['intro', 'verse', 'verse2', 'chorus', 'bridge', 'break', 'final'].forEach(function(s){ var b = document.createElement('button'); b.textContent = s; b.onclick = function(){ Band.jump(s); }; $('secs').appendChild(b); });
  var mute = {};
  Object.keys(BAND_PARTS).forEach(function(p){
    var l = document.createElement('label'), c = document.createElement('input'); c.type = 'checkbox'; c.checked = true; c.onchange = function(){ mute[p] = !c.checked; apply(); };
    l.appendChild(c); l.appendChild(document.createTextNode(p)); $('parts').appendChild(l);
    var o = document.createElement('option'); o.value = p; o.textContent = p; $('solo').appendChild(o);
  });
  function state(){ return { theme: $('song').value, run: $('run').checked, I: +$('I').value, rest: $('rest').checked, low: +$('low').value, lvl: +$('lvl').value, shift: +$('shift').value || 0 }; }
  function apply(){
    $('Iv').textContent = (+$('I').value).toFixed(2); $('lowv').textContent = (+$('low').value).toFixed(2);
    Music.force = state();
    if (Music.S){ Music.S.mute = mute; Music.S.solo = $('solo').value || null; }
  }
  ['song', 'run', 'I', 'rest', 'low', 'lvl', 'shift', 'solo'].forEach(function(id){ $(id).oninput = apply; $(id).onchange = apply; });
  function tick(){
    try { Music.refresh(); if (Music.S){ Music.S.mute = mute; Music.S.solo = $('solo').value || null; } } catch (e) { $('now').textContent = 'error: ' + e.message; return; }
    var S = Music.S, s = S && S.song; if (!s) return;
    $('now').textContent = (s.name || s.theme) + '  (' + S.theme + ')\nsection ' + S.secName + '  bar ' + (S.secBar + 1) + ' of ' + S.secLen + (S.pending ? '  next: ' + S.pending : '') +
      '\n' + Math.round(s.bpm * (Music.cur && Music.cur.tempo || 1)) + ' bpm  key ' + S.key + '  ' + s.mode + '  drums ' + s.groove + '  voices ' + (Music.R ? Music.R.voices : 0);
  }
  $('play').onclick = function(){
    SFX.init(); SFX.resume(); if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
    if (typeof Settings !== 'undefined'){ Settings.muted = false; if (!(Settings.musicVol > 0)) Settings.musicVol = 0.6; }
    apply(); if (!timer) timer = setInterval(tick, 50); tick();
  };
  $('stop').onclick = function(){ if (SFX.ctx) SFX.ctx.suspend(); clearInterval(timer); timer = null; $('now').textContent = 'Stopped.'; };
  $('wav').onclick = function(){
    var st = state(), bars = Math.max(1, Math.min(200, +$('bars').value || 32)); $('wavmsg').textContent = 'drawing ' + bars + ' bars...';
    Band.render(Object.assign(st, { bars: bars, mute: mute, solo: $('solo').value || null, gain: 0.45 })).then(function(buf){
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([Band.wav(buf)], { type: 'audio/wav' })); a.download = st.theme + '.wav'; a.click();
      $('wavmsg').textContent = 'done (' + (buf.length / buf.sampleRate).toFixed(0) + ' s)';
    }, function(e){ $('wavmsg').textContent = 'failed: ' + e; });
  };
  var q = new URLSearchParams(location.search); if (q.get('song')) $('song').value = q.get('song');
})();
</script></body></html>
