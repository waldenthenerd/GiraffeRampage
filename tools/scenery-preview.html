<script>
/* Scenery preview: ?ch=1..13  &zoom=0.33 (default: whole arena)  &px=2100&py=1575 (camera centre)  &t=seconds
   Starts a run in that chapter, removes the creatures and freezes the world, then draws it with the game's own renderer. */
(function(){
  var q = new URLSearchParams(location.search), ch = +q.get('ch') || 1;
  function go(){
    var G = GR.G, P = GR.P;
    GR.Settings.autoKick = false;
    GR.startRun(ch, (ch - 1) * 25 + 10);
    var zoom = parseFloat(q.get('zoom')); if (!isFinite(zoom)) zoom = Math.min(window.innerWidth / 4200, window.innerHeight / 3150) * 0.98;
    var px = parseFloat(q.get('px')), py = parseFloat(q.get('py'));
    var tt = parseFloat(q.get('t')); if (isFinite(tt)) G.time = tt;
    function frame(){
      G.enemies.length = 0; G.state = 'paused'; G.zoom = zoom; G.introFX = null; G.banner = null; G.bannerHold = null;
      if (isFinite(px)) P.x = px; if (isFinite(py)) P.y = py;
      P.invuln = 9;
      GR.render();
    }
    frame(); setInterval(frame, 120);
  }
  (function(){ setTimeout(function(){ try { go(); } catch (err){ var d = document.createElement('div'); d.style.cssText = 'position:fixed;left:8px;top:8px;z-index:99;background:#900;color:#fff;font:14px monospace;padding:6px'; d.textContent = 'preview error: ' + err.message; document.body.appendChild(d); } }, 30); })();
})();
</script>
