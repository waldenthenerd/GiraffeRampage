<script>
/* Enemy gallery: ?ch=1..13  &scale=3  &cols=6  &only=hyena,lion  &anim=1.2  &state=idle|wind  &bg=chapter(default: that chapter's ground color)|dark|light|mid|RRGGBB
   Draws every creature of one chapter with the game's own drawEnemy, so art changes can be checked without playing. */
(function(){
  var q = new URLSearchParams(location.search);
  var ch = +q.get('ch') || 1, scale = +q.get('scale') || 3, cols = +q.get('cols') || 6, state = q.get('state') || 'idle', bg = q.get('bg') || 'chapter';
  var CH_BG = { 1: '#7F6C45', 2: '#C3D6E0', 3: '#3E4A2C', 4: '#0F3A52', 5: '#2A3A1C', 6: '#6A6862', 7: '#5F7F3C', 8: '#8D8C88', 9: '#8A5028', 10: '#4A2A1A', 11: '#7F6C45', 12: '#C2A573', 13: '#B4552F', 14: '#C6DCE6', 15: '#D2D4D8', 16: '#8A8478' };
  var bgc = /^[0-9a-fA-F]{6}$/.test(bg) ? '#' + bg : ({ dark: '#241A12', light: '#E8E0D0', mid: '#808080' }[bg] || CH_BG[ch] || '#7F6C45');
  var table = GR.bestiaryTable(ch), names = Object.keys(table);
  document.getElementById('title').textContent = 'Chapter ' + ch + ' - ' + names.length + ' creatures - state ' + state + ' - scale ' + scale + ' - bg ' + bg;
  var gal = document.getElementById('gal'); gal.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  var only = q.get('only'); if (only) names = names.filter(function(n){ return only.split(',').indexOf(n) >= 0; });
  var animv = parseFloat(q.get('anim')); if (!isFinite(animv)) animv = 1.2;
  names.forEach(function(type){
    var def = table[type], cell = document.createElement('div'); cell.className = 'cell';
    var sc = Math.min(scale, 80 / def.r), box = Math.round(Math.max(150, def.r * sc * 3.2 + 20)), cv = document.createElement('canvas'); cv.width = box; cv.height = box;
    cv.style.background = bgc;
    var c = cv.getContext('2d'); c.translate(box / 2, box / 2); c.scale(sc, sc);
    var e = { portrait: true, def: def, type: type, x: 0, y: 0, r: def.r, ang: 0, flash: 0, state: state, anim: animv, hp: 1, maxHp: 1, big: def.big, kx: 0, ky: 0, stunT: 0, burnT: 0, slowT: 0, slowMul: 1 };
    try { GR.drawEnemy(c, e); } catch (err) { c.setTransform(1,0,0,1,0,0); c.fillStyle = '#f00'; c.fillText('ERR ' + err.message, 4, 14); }
    var label = document.createElement('b'); label.textContent = type + ' / ' + (def.look || 'base') + (def.big ? ' (boss)' : '');
    cell.appendChild(cv); cell.appendChild(label); gal.appendChild(cell);
  });
})();
</script></body></html>
