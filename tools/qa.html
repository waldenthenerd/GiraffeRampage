<script>
/* QA harness: the real game plus a scenario script. Query: s=<scenario file url>, seed=<n>, plus any params the scenario reads from QA.params. */
(function(){
  var q = new URLSearchParams(location.search);
  window.QA = { params: {}, errors: [], result: null, logs: [],
    log: function(){ QA.logs.push(Array.prototype.slice.call(arguments).map(String).join(' ')); },
    done: function(r){ QA.result = r; QA.flush(); QA.hold(); },
    /* after the scenario: keep drawing the final state (and nothing else changes), so a screenshot shows it */
    hold: function(){ if (QA._held) return; QA._held = true; (function l(){ try { GR.render(); } catch (e) {} realRAF(l); })(); },
    flush: function(){
      var pre = document.getElementById('qa-out');
      if (!pre){ pre = document.createElement('pre'); pre.id = 'qa-out'; pre.style.cssText = 'position:fixed;left:-99999px;top:0'; document.body.appendChild(pre); }
      var js = JSON.stringify({ done: QA.result !== null, result: QA.result, errors: QA.errors, logs: QA.logs }); pre.textContent = js; try { console.log('QA_JSON:' + js); } catch (e) {}
    } };
  q.forEach(function(v, k){ QA.params[k] = v; });
  /* the game's own frame loop is stopped: the scenario steps and renders the game itself, so the screenshot shows exactly its end state */
  var realRAF = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function(){ return 0; };
  window.addEventListener('error', function(e){ QA.errors.push(String(e.message) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); QA.flush(); });
  window.addEventListener('unhandledrejection', function(e){ QA.errors.push('promise: ' + String(e.reason)); QA.flush(); });
  /* the same random numbers every run, so a screenshot run matches the data run */
  var s = (parseInt(q.get('seed'), 10) || 12345) >>> 0;
  Math.random = function(){ s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  window.addEventListener('load', function(){
    var f = q.get('s');
    if (!f){ QA.flush(); return; }
    var sc = document.createElement('script'); sc.src = f;
    sc.onerror = function(){ QA.errors.push('could not load scenario ' + f); QA.flush(); };
    document.body.appendChild(sc);
  });
})();
</script>
